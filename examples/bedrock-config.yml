# Amazon Bedrock Configuration Example
# Copy this to config.yml and customize for your setup

bridge:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]

api:
  # AWS/Bedrock Configuration
  region: "${AWS_REGION}"  # e.g., us-east-1, us-west-2, eu-west-1
  model_id: "${BEDROCK_MODEL_ID}"  # e.g., anthropic.claude-3-sonnet-20240229-v1:0
  
  # Generation Parameters
  max_tokens: 1000
  temperature: 0.7
  timeout: 30

logging:
  level: "INFO"

# Environment Variables Required:
# AWS_ACCESS_KEY_ID=your_aws_access_key
# AWS_SECRET_ACCESS_KEY=your_aws_secret_key  
# AWS_REGION=us-east-1
# BEDROCK_MODEL_ID=anthropic.claude-3-sonnet-20240229-v1:0

# Available Bedrock Models:
# - anthropic.claude-3-sonnet-20240229-v1:0
# - anthropic.claude-3-haiku-20240307-v1:0
# - anthropic.claude-3-opus-20240229-v1:0
# - meta.llama2-13b-chat-v1
# - meta.llama2-70b-chat-v1
# - ai21.j2-ultra-v1
# - ai21.j2-mid-v1
# - amazon.titan-text-express-v1
# - amazon.titan-text-lite-v1
